<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <title>Tienda Online</title>
</head>

<body>
    <header>
        <div class="logo-container">
            <p class="logo">Tienda<span>Online</span></p>
        </div>
        <div class="hamburger-menu" id="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav class="nav-menu" id="nav-menu">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
                <li><a href="./cart.html"><i class="fa-solid fa-cart-shopping"></i><span id="cart-count">0</span></a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="cart-container">
            <h1>Tu Carrito</h1>
            <div id="cart-items">
            </div>
            <div class="cart-summary">
                <div class="coupon-section">
                    <input type="text" id="coupon-code" placeholder="Ingresa tu código de cupón">
                    <button id="btn-apply-coupon" class="btn-secondary">Aplicar cupón</button>
                    <p id="coupon-message" class="coupon-message"></p>
                </div>
                <p>Total: <span id="cart-total">$0</span></p>
                <button id="btn-checkout" class="btn-buy">Finalizar Pago</button>
                <button id="btn-empty" class="btn-empty">Vaciar Carrito</button>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <p><span>Trabajo Práctico PP2 - Equipo 1 - IFTS-16</span> - &copy; 2026 Tienda Online. Todos los derechos
                reservados.</p>
        </div>
    </footer>
    <script src="../js/main.js"></script>
</body>

</html>
